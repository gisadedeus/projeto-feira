<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summit - Consulta de Representantes</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topo">

    <div class="logo">
        <h1>Summit</h1>
        <span>Consulta de Representantes</span>
    </div>

</header>

<section class="pesquisa">

    <input
        id="pesquisa"
        type="text"
        placeholder="Pesquisar representante, empresa, UF ou supervisor...">

    <button id="limpar">
        Limpar
    </button>

</section>

<section id="contador"></section>

<section id="lista"></section>

<div id="modal" class="modal">

    <div class="modal-conteudo">

        <button id="fechar">✕</button>

        <h2 id="nomeRep"></h2>

        <p><strong>Empresa:</strong> <span id="empresa"></span></p>

        <p><strong>UF:</strong> <span id="uf"></span></p>

        <p><strong>Área:</strong> <span id="area"></span></p>

        <p><strong>Supervisor:</strong> <span id="supervisor"></span></p>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
